<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物资管理系统 Supabase版</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {box-sizing: border-box; font-family: "Microsoft Yahei", sans-serif;margin:0;padding:0;}
        body {padding:12px;max-width:1200px;margin:0 auto;}
        .hidden {display: none;}
        .card {border:1px solid #ccc; padding:16px; border-radius:8px; margin-bottom:12px;}
        table {width:100%; border-collapse: collapse; margin:10px 0; font-size:14px;}
        th,td {border:1px solid #aaa; padding:8px; text-align:center;}
        th {background:#f2f2f2;}
        button {padding:7px 10px; cursor:pointer; margin:3px; border:none; background:#2563eb;color:#fff;border-radius:4px;}
        button.danger {background:#dc2626;}
        button.success {background:#16a34a;}
        input, select {padding:7px; width:100%;max-width:300px; margin:4px 0;}
        .nav {background:#333; padding:12px; color:white; border-radius:6px;margin-bottom:15px;}
        .tip {margin:8px 0;color:red;}
    </style>
</head>
<body>
<div>
    <!-- 登录页 -->
    <div id="loginPage" class="card">
        <h2>物资管理系统 - 登录</h2>
        <div>用户名：<input id="username" type="text"></div>
        <div>密码：<input id="pwd" type="password"></div>
        <br>
        <button onclick="login()">登录</button>
        <div id="loginTip" class="tip"></div>
    </div>
    <!-- 主系统页面 -->
    <div id="mainPage" class="hidden">
        <div class="nav">
            <span>当前用户：<b id="curUser"></b></span>
            <span>角色：<b id="curRole"></b></span>
            <button onclick="logout()" style="float:right" class="danger">退出登录</button>
        </div>
        <div>
            <button onclick="showPanel('goodsList')">物资列表</button>
            <button onclick="showPanel('flowApply')">发起流转申请</button>
            <button onclick="showPanel('flowOperate')">流转操作(同意/拒绝/撤回)</button>
            <button onclick="showPanel('flowRecord')">流转记录</button>
            <button id="adminMenu" class="hidden" onclick="showPanel('adminPanel')">管理员面板</button>
            <button id="exportBtn" class="hidden" onclick="exportExcel()">导出Excel报表</button>
        </div>

        <!-- 物资列表 -->
        <div id="goodsList" class="panel card">
            <h3>物资列表</h3>
            <table>
                <tr><th>物资ID</th><th>名称</th><th>属性</th><th>当前位置</th><th>回收站</th><th>最近流转</th></tr>
                <tbody id="goodsTableBody"></tbody>
            </table>
        </div>

        <!-- 发起流转申请 -->
        <div id="flowApply" class="panel card hidden">
            <h3>发起流转申请</h3>
            <div>物资ID：<input id="applyGoodsId" type="number" placeholder="物资ID"></div>
            <div>申请类型：
                <select id="applyType">
                    <option value="userTransfer">用户间移交</option>
                    <option value="getWarehouse">仓库申领</option>
                    <option value="backWarehouse">归还仓库</option>
                </select>
            </div>
            <div>目标用户ID：<input id="targetUserId" type="number" placeholder="目标用户ID"></div>
            <button onclick="submitApply()" class="success">提交申请</button>
            <div id="applyTip" class="tip"></div>
        </div>

        <!-- 普通用户流转操作：同意 / 拒绝 / 撤回 -->
        <div id="flowOperate" class="panel card hidden">
            <h3>流转申请操作（填写流转记录ID）</h3>
            <div>流转记录ID：<input id="userFlowRecordId" type="number" placeholder="流转记录ID"></div>
            <p>仅用于【用户互转】申请</p>
            <button onclick="acceptTransfer()" class="success">接收方同意</button>
            <button onclick="rejectTransfer()" class="danger">接收方拒绝</button>
            <button onclick="cancelApply()">申请人撤回申请</button>
        </div>

        <!-- 流转记录 -->
        <div id="flowRecord" class="panel card hidden">
            <h3>流转历史记录</h3>
            <table>
                <tr><th>记录ID</th><th>物资ID</th><th>操作类型</th><th>状态</th><th>申请人</th><th>操作人</th><th>时间</th></tr>
                <tbody id="recordBody"></tbody>
            </table>
        </div>

        <!-- 管理员面板 -->
        <div id="adminPanel" class="panel card hidden">
            <h3>管理员操作面板</h3>
            <h4>新增物资</h4>
            <div>名称<input id="addGoodsName"></div>
            <div>属性<input id="addGoodsAttr"></div>
            <button onclick="addGoods()" class="success">新增物资</button>
            <hr>
            <h4>物资操作</h4>
            <div>物资ID<input id="opGoodsId"></div>
            <button onclick="forceTransfer()">强制调拨</button>
            <button onclick="setRecycle()">报失/报废</button>
            <button onclick="recycleRestore()">复原物资</button>
            <hr>
            <h4>审核申请（输入流转记录ID）</h4>
            <div>流转记录ID：<input id="flowOpRecordId" type="number" placeholder="填写待确认的flow_record ID"></div>
            <button onclick="adminConfirm()">管理员代确认流转</button>
            <button onclick="auditPass()">审核通过申领/归还</button>
            <button onclick="auditReject()">驳回申领/归还</button>
        </div>
    </div>
</div>

<script>
// ===================== 【已填入你的Supabase信息】=====================
const SUPABASE_URL = "https://brvirrexwaulvnddgaxd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_xCmk41YQebX2e1SGgXlMlQ_Isom7FoR";
// ========================================================================
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentLoginUser = null;

// 登录
async function login(){
    const uname = document.getElementById("username").value.trim();
    const pwd = document.getElementById("pwd").value.trim();
    const tip = document.getElementById("loginTip");
    tip.innerText="";
    try{
        const {data,error}=await sb.from("user").select("*").eq("username",uname).eq("password_hash",pwd).single();
        if(error || !data){
            tip.innerText="用户名或密码错误";
            return;
        }
        currentLoginUser = data;
        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("mainPage").classList.remove("hidden");
        document.getElementById("curUser").innerText = data.username;
        document.getElementById("curRole").innerText = data.role===1?"管理员":"普通用户";
        if(data.role === 1){
            document.getElementById("adminMenu").classList.remove("hidden");
            document.getElementById("exportBtn").classList.remove("hidden");
        }
        await refreshGoodsTable();
        await refreshRecordTable();
    }catch(e){
        tip.innerText="网络异常："+e.message;
    }
}

// 退出
function logout(){
    currentLoginUser=null;
    document.getElementById("mainPage").classList.add("hidden");
    document.getElementById("loginPage").classList.remove("hidden");
}

// 切换面板
function showPanel(panelId){
    document.querySelectorAll(".panel").forEach(p=>p.classList.add("hidden"));
    document.getElementById(panelId).classList.remove("hidden");
    if(currentLoginUser) refreshGoodsTable();
}

// 刷新物资列表
async function refreshGoodsTable(){
    if(!currentLoginUser) return;
    const tbody = document.getElementById("goodsTableBody");
    tbody.innerHTML = "";
    let {data:goodsList,error} = await sb.from("goods").select("*");
    if(error){alert("读取物资失败："+error.message);return;}
    // 普通用户只看归属自己的物资
    if(currentLoginUser.role ===0){
        goodsList = goodsList.filter(g=>g.current_location == currentLoginUser.id);
    }
    goodsList.forEach(g=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${g.id}</td>
            <td>${g.name}</td>
            <td>${g.attr}</td>
            <td>${g.current_location == "warehouse" ? "仓库" : "用户ID:"+g.current_location}</td>
            <td>${g.is_recycle?"✅回收站":"正常"}</td>
            <td>${g.last_flow}</td>
        `
        tbody.appendChild(tr);
    })
}

// 刷新流转记录
async function refreshRecordTable(){
    if(!currentLoginUser) return;
    const tbody = document.getElementById("recordBody");
    tbody.innerHTML = "";
    const {data:records,error}=await sb.from("flow_record").select("*").order("create_time",{ascending:false});
    if(error){alert("读取流转记录失败："+error.message);return;}
    records.forEach(r=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${r.id}</td>
            <td>${r.goods_id}</td>
            <td>${r.oper_type}</td>
            <td>${r.status}</td>
            <td>${r.applicant_id||""}</td>
            <td>${r.oper_user_id}</td>
            <td>${new Date(r.create_time).toLocaleString()}</td>
        `
        tbody.appendChild(tr);
    })
}

// 提交流转申请
async function submitApply(){
    const gid = parseInt(document.getElementById("applyGoodsId").value);
    const type = document.getElementById("applyType").value;
    const targetUid = document.getElementById("targetUserId").value;
    const tip = document.getElementById("applyTip");
    tip.innerText="";
    try{
        const {data:good,error}=await sb.from("goods").select("*").eq("id",gid).single();
        if(error || !good){tip.innerText="物资不存在";return;}
        if(good.is_recycle ===1){tip.innerText="物资在回收站，不可发起申请";return;}

        // 校验：该物资是否存在待确认申请
        const {data:existFlow,errFlow}=await sb.from("flow_record").select("*").eq("goods_id",gid).eq("status","待接收确认");
        if(errFlow) {tip.innerText="校验失败";return;}
        if(existFlow && existFlow.length>0){tip.innerText="该物资已有待确认流转申请";return;}

        const operType = type=="userTransfer"?"用户互转":type=="getWarehouse"?"申领仓库":"归还仓库";
        const expireTime = new Date(Date.now() + 24*60*60*1000).toISOString();
        const insertData = {
            goods_id:gid,
            oper_type:operType,
            status:"待接收确认",
            applicant_id:currentLoginUser.id,
            target_id:targetUid,
            oper_user_id:currentLoginUser.id,
            expire_time:expireTime,
            record_detail:`${currentLoginUser.username}发起${operType}申请`
        }
        const {error:insertErr} = await sb.from("flow_record").insert([insertData]);
        if(insertErr){tip.innerText="提交失败："+insertErr.message;return;}
        tip.innerText="✅申请提交成功，有效期24小时";
        await refreshRecordTable();
    }catch(e){
        tip.innerText="异常："+e.message;
    }
}

// ==========普通用户流转操作：接收方同意、接收方拒绝、申请人撤回==========
/**接收方同意 用户互转申请 */
async function acceptTransfer(){
    const recordId = parseInt(document.getElementById("userFlowRecordId").value);
    if(!recordId){alert("请填写流转记录ID");return;}
    try{
        const {data:flowRec,error:recErr}=await sb.from("flow_record")
            .select("*")
            .eq("id",recordId)
            .eq("status","待接收确认")
            .eq("oper_type","用户互转")
            .single();
        if(recErr||!flowRec){alert("找不到待确认的用户互转申请");return;}
        // target_id是接收方ID，校验当前登录用户必须是接收方
        if(String(currentLoginUser.id) !== String(flowRec.target_id)){
            alert("只有该申请的接收方可以执行同意！");
            return;
        }
        const goodsId = flowRec.goods_id;
        const newLoc = flowRec.target_id;

        await sb.from("flow_record").update({
            status:"已同意",
            record_detail:`接收方${currentLoginUser.username}同意用户互转申请`
        }).eq("id",recordId);

        await sb.from("goods").update({
            current_location:newLoc,
            last_flow:`接收方同意流转，目标用户ID${newLoc} ${new Date().toLocaleString()}`
        }).eq("id",goodsId);

        alert("✅接收方同意完成");
        await refreshGoodsTable();await refreshRecordTable();
    }catch(e){alert("同意异常："+e.message);}
}

/**接收方拒绝 用户互转申请 */
async function rejectTransfer(){
    const recordId = parseInt(document.getElementById("userFlowRecordId").value);
    if(!recordId){alert("请填写流转记录ID");return;}
    try{
        const {data:flowRec,error:recErr}=await sb.from("flow_record")
            .select("*")
            .eq("id",recordId)
            .eq("status","待接收确认")
            .eq("oper_type","用户互转")
            .single();
        if(recErr||!flowRec){alert("找不到待确认的用户互转申请");return;}
        if(String(currentLoginUser.id) !== String(flowRec.target_id)){
            alert("只有该申请的接收方可以执行拒绝！");
            return;
        }
        await sb.from("flow_record").update({
            status:"接收方拒绝",
            record_detail:`接收方${currentLoginUser.username}拒绝用户互转申请，物资位置不变`
        }).eq("id",recordId);

        alert("✅接收方已拒绝，物资位置不变");
        await refreshGoodsTable();await refreshRecordTable();
    }catch(e){alert("拒绝异常："+e.message);}
}

/**申请人撤回申请 */
async function cancelApply(){
    const recordId = parseInt(document.getElementById("userFlowRecordId").value);
    if(!recordId){alert("请填写流转记录ID");return;}
    try{
        const {data:flowRec,error:recErr}=await sb.from("flow_record")
            .select("*")
            .eq("id",recordId)
            .eq("status","待接收确认")
            .single();
        if(recErr||!flowRec){alert("找不到待确认申请");return;}
        // 校验：只有申请人本人可以撤回
        if(currentLoginUser.id !== flowRec.applicant_id){
            alert("只有申请人本人可以撤回该申请！");
            return;
        }
        await sb.from("flow_record").update({
            status:"申请人撤回",
            record_detail:`申请人${currentLoginUser.username}撤回申请，物资位置不变`
        }).eq("id",recordId);

        alert("✅申请人撤回申请完成");
        await refreshGoodsTable();await refreshRecordTable();
    }catch(e){alert("撤回异常："+e.message);}
}

// ============管理员接口============
async function addGoods(){
    const name = document.getElementById("addGoodsName").value;
    const attr = document.getElementById("addGoodsAttr").value;
    const {error}=await sb.from("goods").insert([{
        name:name,attr:attr,current_location:"warehouse",last_flow:"管理员新增物资",is_recycle:0
    }]);
    if(error){alert("新增失败："+error.message);return;}
    alert("新增物资成功");
    await refreshGoodsTable();
}

async function forceTransfer(){
    const gid = parseInt(document.getElementById("opGoodsId").value);
    const targetLoc = prompt("请输入目标位置：用户ID 或 warehouse");
    if(!targetLoc) return;
    const {data:g,error}=await sb.from("goods").select("*").eq("id",gid).single();
    if(error || !g){alert("物资不存在");return;}
    // 管理员强制调拨：作废该物资所有待确认申请
    await sb.from("flow_record")
        .update({status:"超时失效",record_detail:"管理员强制调拨，申请自动作废"})
        .eq("goods_id",gid).eq("status","待接收确认");

    await sb.from("goods").update({
        current_location:targetLoc,
        last_flow:`管理员强制调拨至${targetLoc} ${new Date().toLocaleString()}`
    }).eq("id",gid);

    await sb.from("flow_record").insert([{
        goods_id:gid,oper_type:"强制调拨",status:"已同意",
        applicant_id:null,target_id:targetLoc,oper_user_id:currentLoginUser.id,
        record_detail:`管理员强制调拨物资至${targetLoc}`
    }]);
    alert("强制调拨完成");
    await refreshGoodsTable();await refreshRecordTable();
}

async function setRecycle(){
    const gid = parseInt(document.getElementById("opGoodsId").value);
    const {data:g,error}=await sb.from("goods").select("*").eq("id",gid).single();
    if(error || !g){alert("物资不存在");return;}
    await sb.from("goods").update({is_recycle:1,last_flow:`报失报废 ${new Date().toLocaleString()}`}).eq("id",gid);
    await sb.from("flow_record").insert([{
        goods_id:gid,oper_type:"报失报废",status:"已同意",applicant_id:null,
        oper_user_id:currentLoginUser.id,record_detail:"管理员标记物资报失报废"
    }]);
    alert("物资进入回收站");
    await refreshGoodsTable();await refreshRecordTable();
}

async function recycleRestore(){
    const gid = parseInt(document.getElementById("opGoodsId").value);
    const {data:g,error}=await sb.from("goods").select("*").eq("id",gid).single();
    if(error || !g){alert("物资不存在");return;}
    await sb.from("goods").update({is_recycle:0,current_location:"warehouse",last_flow:`复原物资 ${new Date().toLocaleString()}`}).eq("id",gid);
    await sb.from("flow_record").insert([{
        goods_id:gid,oper_type:"复原",status:"已同意",applicant_id:null,
        oper_user_id:currentLoginUser.id,record_detail:"管理员复原物资至仓库"
    }]);
    alert("物资复原成功");
    await refreshGoodsTable();await refreshRecordTable();
}

/**管理员代接收方确认流转申请 */
async function adminConfirm() {
    const recordId = parseInt(document.getElementById("flowOpRecordId").value);
    if (!recordId) {
        alert("请输入流转记录ID");
        return;
    }
    try {
        const { data: flowRec, error: recErr } = await sb
            .from("flow_record")
            .select("*")
            .eq("id", recordId)
            .eq("status", "待接收确认")
            .single();

        if (recErr || !flowRec) {
            alert("未找到待确认的该条流转申请");
            return;
        }
        if (flowRec.oper_type !== "用户互转") {
            alert("代确认仅支持【用户互转】类型申请，请使用审核通过");
            return;
        }
        const goodsId = flowRec.goods_id;
        const targetLoc = flowRec.target_id;

        await sb.from("flow_record")
            .update({
                status: "管理员代确认完成",
                record_detail: `${currentLoginUser.username}管理员代接收方确认流转申请`
            })
            .eq("id", recordId);

        await sb.from("goods")
            .update({
                current_location: targetLoc,
                last_flow: `管理员代确认流转，目标：${targetLoc} ${new Date().toLocaleString()}`
            })
            .eq("id", goodsId);

        alert("✅管理员代确认流转完成");
        await refreshGoodsTable();
        await refreshRecordTable();
    } catch (e) {
        alert("代确认异常：" + e.message);
    }
}

/**审核通过：申领仓库 / 归还仓库 */
async function auditPass() {
    const recordId = parseInt(document.getElementById("flowOpRecordId").value);
    if (!recordId) {
        alert("请输入流转记录ID");
        return;
    }
    try {
        const { data: flowRec, error: recErr } = await sb
            .from("flow_record")
            .select("*")
            .eq("id", recordId)
            .eq("status", "待接收确认")
            .single();

        if (recErr || !flowRec) {
            alert("未找到待确认该条申请");
            return;
        }
        const goodsId = flowRec.goods_id;
        let newLocation;
        if (flowRec.oper_type === "申领仓库") {
            newLocation = flowRec.applicant_id;
        } else if (flowRec.oper_type === "归还仓库") {
            newLocation = "warehouse";
        } else {
            alert("审核通过仅支持【申领仓库 / 归还仓库】");
            return;
        }

        await sb.from("flow_record")
            .update({
                status: "已同意",
                record_detail: `${currentLoginUser.username}审核通过${flowRec.oper_type}申请`
            })
            .eq("id", recordId);

        await sb.from("goods")
            .update({
                current_location: newLocation,
                last_flow: `审核通过${flowRec.oper_type}，位置变更为${newLocation} ${new Date().toLocaleString()}`
            })
            .eq("id", goodsId);

        alert("✅审核通过完成");
        await refreshGoodsTable();
        await refreshRecordTable();
    } catch (e) {
        alert("审核通过异常：" + e.message);
    }
}

/**驳回申领/归还申请 */
async function auditReject() {
    const recordId = parseInt(document.getElementById("flowOpRecordId").value);
    if (!recordId) {
        alert("请输入流转记录ID");
        return;
    }
    try {
        const { data: flowRec, error: recErr } = await sb
            .from("flow_record")
            .select("*")
            .eq("id", recordId)
            .eq("status", "待接收确认")
            .single();

        if (recErr || !flowRec) {
            alert("未找到待确认该条申请");
            return;
        }
        if (!["申领仓库", "归还仓库"].includes(flowRec.oper_type)) {
            alert("驳回仅支持【申领仓库 / 归还仓库】");
            return;
        }

        await sb.from("flow_record")
            .update({
                status: "管理员驳回（申领/归还）",
                record_detail: `${currentLoginUser.username}驳回${flowRec.oper_type}申请，物资位置保持不变`
            })
            .eq("id", recordId);

        alert("✅已驳回申请，物资位置保持不变");
        await refreshGoodsTable();
        await refreshRecordTable();
    } catch (e) {
        alert("驳回异常：" + e.message);
    }
}

function exportExcel(){
    alert("模拟导出Excel");
}
</script>
</body>
</html>
